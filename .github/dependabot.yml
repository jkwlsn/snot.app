version: 2

updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"

    cooldown:
      default-days: 3
      semver-major-days: 7
      semver-minor-days: 3
      semver-patch-days: 3

    groups:
      # Update framework together
      framework:
        patterns:
          - "@sveltejs/**"
          - "svelte"
          - "vite"
          - "vite-*"
        update-types:
          - "minor"
          - "patch"

      tooling:
        dependency-type: "development"
        patterns:
          - "typescript"
          - "@oxlint/*"
          - "vitest"
          - "@vitest/*"
          - "playwright"
          - "@playwright/*"
        update-types:
          - "minor"
          - "patch"

      production-minor:
        dependency-type: "production"
        update-types:
          - "minor"
          - "patch"

      development-minor:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

      production-major:
        dependency-type: "production"
        update-types:
          - "major"

      development-major:
        dependency-type: "development"
        update-types:
          - "major"

    labels:
      - "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/London"

    groups:
      github-actions:
        update-types:
          - "minor"
          - "patch"
          - "major"
